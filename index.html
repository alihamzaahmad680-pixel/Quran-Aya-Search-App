<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Quran Search | Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .arabic-text {
        font-family: "Amiri", serif;
        direction: rtl;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-12 px-4 selection:bg-emerald-500 selection:text-slate-900"
  >
    <header class="text-center mb-10 max-w-2xl">
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">
        Ayah
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500"
          >Search</span
        >
        Hub
      </h1>
      <p class="text-slate-400 text-sm md:text-base">
        Explore the Holy Quran with authentic Arabic text and multi-language
        translations instantly.
      </p>
    </header>

    <main class="w-full max-w-3xl">
      <div
        class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl backdrop-blur-sm mb-8"
      >
        <form id="searchForm" class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <input
              type="text"
              id="SearchInput"
              placeholder="e.g., 2:255 or Surah Name..."
              class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3.5 pl-4 pr-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200"
            />
          </div>
          <button
            id="submit"
            type="submit"
            class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-slate-950 font-semibold px-8 py-3.5 rounded-xl shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/20 active:scale-98 transition-all duration-200 cursor-pointer text-center"
          >
            Search
          </button>
        </form>
      </div>

      <div id="resultContainer" class="space-y-6">
        <div
          class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 md:p-8 shadow-md"
        >
          <div
            class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3"
          >
            <span
              class="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full"
              >Arabic Text</span
            >
            <span class="text-xs text-slate-500">القرآن الكريم</span>
          </div>
          <h3
            id="output"
            class="arabic-text text-3xl md:text-4xl text-emerald-100 leading-loose text-right min-h-12 selection:bg-amber-500"
          >
            قُلْ هُوَ اللَّهُ أَحَدٌ
          </h3>
        </div>

        <div
          class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 md:p-8 shadow-md"
        >
          <div
            class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3"
          >
            <span
              class="text-xs font-bold uppercase tracking-wider text-teal-400 bg-teal-500/10 px-3 py-1 rounded-full"
              >Translation</span
            >
            <span class="text-xs text-slate-500">English / Urdu</span>
          </div>
          <h3
            id="toutput"
            class="text-lg md:text-xl text-slate-300 font-medium leading-relaxed min-h-12"
          >
            Say, "He is Allah, [who is] One."
          </h3>
        </div>
      </div>
    </main>

    <!-- <footer class="mt-auto pt-12 text-center text-xs text-slate-600">
      Built with ❤️ for a Premium Quranic Experience
    </footer> -->

    <script src="./script.js"></script>
  </body>
</html>
